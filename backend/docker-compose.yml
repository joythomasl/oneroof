# ONE ROOF - Local infrastructure
#
# Person 5B owns: redis, minio, minio-init
# Person 5A owns: postgres/postgis (commented placeholder at the
#                 bottom - uncomment and configure, do not remove
#                 the 5B services).
#
#   docker compose up -d
#   docker compose ps
#   docker compose down          # keeps volumes
#   docker compose down -v       # wipes volumes

services:
  redis:
    image: redis:7-alpine
    container_name: oneroof-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: oneroof-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot job: creates the bucket so the API never has to.
  # The API also self-heals (see s3_service.ensure_bucket), this
  # just makes a fresh `docker compose up` immediately usable.
  minio-init:
    image: minio/mc:latest
    container_name: oneroof-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-oneroof-uploads}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      echo 'Bucket ready:' $$MINIO_BUCKET
      "
    restart: "no"

  # ------------------------------------------------------------
  # PERSON 5A: database service goes here.
  # Uncomment and adjust - do not modify the services above.
  # ------------------------------------------------------------
